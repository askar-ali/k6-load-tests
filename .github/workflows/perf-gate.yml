name: perf-gate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Service to test (default: local mock)"
        required: false
jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Unit-test the comparison script
        run: python3 -I -m unittest discover -s scripts/tests
      - name: Start mock target
        if: ${{ !inputs.base_url }}
        run: python3 mock/server.py & sleep 2
      - name: Run load test
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8080' }}
        run: ./run.sh checkout-flow
      - name: Compare with baseline (when one is committed)
        run: |
          if [ -f baselines/checkout-flow.json ]; then
            python3 -I scripts/compare-results.py baselines/checkout-flow.json "$(ls -t results/checkout-flow-*.json | head -1)"
          else
            echo "No baseline committed; thresholds in the test still apply."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results/*.json
